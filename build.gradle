buildscript {
    def versionPropsFile = file('version.properties')
    Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))

    def snapshot = versionProps['version.snapshot'].toBoolean()
    def stage = versionProps['version.stage'].toString()
    def major = versionProps['version.major'].toInteger()
    def minor = versionProps['version.minor'].toInteger()
    def patch = versionProps['version.patch'].toInteger()
    def build = versionProps['version.build'].toInteger()

    version = snapshot
            ? "${major}.${minor}.${patch}${stage}-snapshot#${build}"
            : "${major}.${minor}.${patch}${stage}"
    project.version = version
}

plugins {
    id 'java-library'
    id 'idea'
    alias(libs.plugins.architectury)
    alias(libs.plugins.architectury.loom) apply false
    alias(libs.plugins.loom.quiltflower) apply false
}

group = project_group
base {
    archivesName = project_name
}

ext.resolveVisorJar = { String propertyName, String environmentName ->
    def configuredPath = rootProject.findProperty(propertyName)
            ?: System.getenv(environmentName)
    if (configuredPath == null || configuredPath.toString().isBlank()) {
        throw new GradleException(
                "Missing ${propertyName}. Set it in gradle.properties, pass " +
                "-P${propertyName}=<path>, or set ${environmentName}."
        )
    }
    def visorJar = rootProject.file(configuredPath.toString())
    if (!visorJar.isFile()) {
        throw new GradleException("Missing Visor dependency: ${visorJar}")
    }
    return visorJar
}

ext.resolveVisorFabricJar = {
    rootProject.ext.resolveVisorJar.call(
            'local_visor_fabric_jar',
            'VISOR_FABRIC_JAR'
    )
}

ext.resolveVisorNeoForgeJar = {
    rootProject.ext.resolveVisorJar.call(
            'local_visor_neoforge_jar',
            'VISOR_NEOFORGE_JAR'
    )
}

tasks.named('jar') {
    enabled = false
}

architectury {
    minecraft = libs.versions.minecraftVersion.get()
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: libs.plugins.architectury.asProvider().get().pluginId
    apply plugin: libs.plugins.architectury.loom.get().pluginId
    apply plugin: libs.plugins.loom.quiltflower.get().pluginId

    group = rootProject.group
    version = rootProject.version
    base {
        archivesName = project_name
    }

    loom {
        silentMojangMappingsLicense()
    }

    java {
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
        options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-Xlint:deprecation'])
    }

    tasks.named('processResources') {
        from(rootProject.file('LICENCE.md')) {
            rename { 'LICENSE-VisorHandInteractions.md' }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${libs.versions.minecraftVersion.get()}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${libs.versions.minecraftVersion.get()}:${libs.versions.parchment.get()}@zip")
        }

        compileOnly(libs.bundles.annotations)
        annotationProcessor(libs.bundles.annotations)
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://libraries.minecraft.net/" }
        maven { url "https://maven.parchmentmc.org" }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

